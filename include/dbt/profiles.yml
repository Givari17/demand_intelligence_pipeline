demand_intelligence_project:
  target: duckdb   # <- jalur aktif fase 1
  outputs:
    duckdb:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '/opt/airflow/include/dbt/demand_intelligence.duckdb') }}"
      threads: 4

    # Backburner: baru dipakai kalau kamu switch `target: snowflake` di atas,
    # setelah kredensial trial Snowflake siap sebagai Codespaces secret.
    snowflake:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', '') }}"
      user: "{{ env_var('SNOWFLAKE_USER', '') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD', '') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'TRANSFORMER') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'DEMAND_INTELLIGENCE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'COMPUTE_WH') }}"
      schema: gold
      threads: 4
