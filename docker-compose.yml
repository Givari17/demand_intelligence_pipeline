# Berbasis docker-compose.yaml resmi Apache Airflow untuk CeleryExecutor,
# disesuaikan untuk project ini (DuckDB, dbt, Snowflake, Soda, monitoring, BI).
# Referensi resmi: https://airflow.apache.org/docs/apache-airflow/stable/howto/docker-compose/index.html
#
# CATATAN PENTING (baca sebelum run):
# Astro CLI (`astro dev start`) HANYA mendukung LocalExecutor untuk local dev --
# CeleryExecutor di Astro CLI cuma tersedia untuk deployment yang di-hosting di Astro Cloud,
# bukan untuk environment lokal/Codespaces. Karena kamu eksplisit mau Redis + CeleryExecutor
# jalan di Codespaces, compose ini pakai docker-compose resmi Airflow (bukan `astro dev start`).
# Struktur folder (dags/, include/, plugins/, requirements.txt) sengaja tetap dipertahankan
# supaya familiar dan gampang dipindah ke Astro CLI nanti kalau suatu saat deploy ke Astro Cloud.

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow/airflow
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres-airflow/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
    AIRFLOW__CORE__AUTH_MANAGER: "airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # StatsD -> statsd-exporter -> Prometheus -> Grafana
    AIRFLOW__METRICS__STATSD_ON: "true"
    AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
    AIRFLOW__METRICS__STATSD_PORT: 8125
    AIRFLOW__METRICS__STATSD_PREFIX: airflow
    # Dipakai di dalam DAG (lihat dags/demand_intelligence_dag.py)
    DUCKDB_PATH: /opt/airflow/include/dbt/demand_intelligence.duckdb
    DBT_PROJECT_DIR: /opt/airflow/include/dbt
    SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
    SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
    SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:-}
    SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-TRANSFORMER}
    SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-DEMAND_INTELLIGENCE}
    SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-COMPUTE_WH}
    YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./include:/opt/airflow/include
    - ./plugins:/opt/airflow/plugins
    - ./tests:/opt/airflow/tests
    - airflow-logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres-airflow:
      condition: service_healthy

services:
  # --- Metadata DB Airflow sendiri (terpisah dari DuckDB/Snowflake yang jadi DWH pipeline) ---
  postgres-airflow:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    expose:
      - 6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-airflow}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:-airflow}" \
          --firstname Airflow --lastname Admin --role Admin \
          --email admin@example.com
    depends_on: *airflow-common-depends-on

  # Airflow 3.x memisahkan API/UI server dari scheduler (beda dari Airflow 2.x
  # yang cuma punya "webserver"). Command-nya juga berubah jadi "api-server".
  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Airflow 3.x juga memisahkan DAG parsing dari scheduler ke proses sendiri.
  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-worker:
    <<: *airflow-common
    command: celery worker
    healthcheck:
      test: ["CMD", "celery", "--app", "airflow.providers.celery.executors.celery_executor.app", "inspect", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # --- Monitoring: Airflow -> StatsD -> Prometheus -> Grafana ---
  statsd-exporter:
    image: prom/statsd-exporter:latest
    command: ["--statsd.listen-udp=:8125", "--web.listen-address=:9102"]
    expose:
      - 8125/udp
      - 9102
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # --- BI ---
  metabase:
    image: metabase/metabase:latest
    volumes:
      - ./include/dbt:/data/dbt:ro   # akses file demand_intelligence.duckdb untuk koneksi DuckDB driver
      - metabase-data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    ports:
      - "3001:3000"   # 3001 di host supaya tidak bentrok dengan Grafana (3000)
    restart: unless-stopped

volumes:
  postgres-airflow-data:
  airflow-logs:
  prometheus-data:
  grafana-data:
  metabase-data:
